<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chun-Hao &amp; Liang-Jou · 牽紅線</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--accent:#A9484E;--red:#D3252B;--ink:#5A3530;--soft:#8C6A5E;--W:min(80vw,360px)}
*{box-sizing:border-box;font-variant-numeric:lining-nums}
html,body{overflow-x:hidden}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 0 34px;font-family:'Noto Serif TC',serif;color:var(--ink);
 background:radial-gradient(ellipse at 15% 10%,#FFF6F4,transparent 55%),radial-gradient(ellipse at 90% 90%,#F6D6DA,transparent 55%),linear-gradient(160deg,#FDF2F0,#F4DADB)}
.top{position:relative;z-index:2;text-align:center}
.small{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:13px;letter-spacing:.32em;color:var(--soft)}
.names{font-family:'Great Vibes',cursive;color:var(--accent);font-size:38px;line-height:1.15;white-space:nowrap}
.cap{position:relative;z-index:2;height:44px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;letter-spacing:.14em;color:var(--red)}
.cap:empty{height:0;margin:0}
.cap span{display:inline-block;animation:capIn .5s cubic-bezier(.3,1.6,.5,1)}
.cap .en{font-family:'Great Vibes',cursive;font-weight:400;font-size:36px;letter-spacing:0;color:#B8914F;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.say{position:absolute;z-index:4;padding:8px 14px;border-radius:16px;background:#fff;color:var(--red);font-weight:900;font-size:17px;letter-spacing:.06em;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.16);pointer-events:none;opacity:0;transform:scale(.4);transform-origin:var(--to,20% 100%);transition:opacity .2s}
.say.on{opacity:1;transform:scale(1);transition:transform .45s cubic-bezier(.3,1.6,.5,1) .25s,opacity .2s .25s}
.say::after{content:"";position:absolute;bottom:-9px;border:6px solid transparent;border-top:8px solid #fff}
.say.l::after{left:22%}.say.r::after{right:22%}
@keyframes capIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.stage{position:relative;width:100vw;display:flex;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;padding:6px 0 104px}
.frame{position:relative;width:var(--W);aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#fff;
 box-shadow:0 18px 40px rgba(150,50,60,.22),0 0 0 7px #fff,0 0 0 8px rgba(201,114,122,.35);will-change:transform;z-index:2}
.ph{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}
.ph.on{opacity:1}
.ph .bg{display:none}
.ph{background:linear-gradient(180deg,#F4F3F6,#E9E8EE)}
.ph .fg{position:absolute;inset:0;background:center/contain no-repeat}
.rope{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.rope path{fill:none;stroke:#C41E24;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 2px 2px rgba(120,20,20,.25))}
.knob{position:absolute;z-index:4;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none}
.knob svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(140,20,30,.35))}
.knob.pulse svg{animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.hint{position:relative;z-index:2;font-size:14px;letter-spacing:.1em;color:var(--accent);height:20px;transition:opacity .3s}
.dots{position:relative;z-index:2;display:flex;gap:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:#E6C3C3;transition:all .3s}
.dots i.on{background:var(--accent);width:20px;border-radius:4px}
.burst{position:fixed;z-index:9;pointer-events:none;width:22px;height:22px;margin:-11px 0 0 -11px}
.after{position:relative;z-index:2;opacity:0;transform:translateY(8px);transition:all .6s ease .3s;text-align:center;font-size:15px;line-height:2;letter-spacing:.08em;pointer-events:none}
.after b{color:var(--accent);font-size:17px}
.done .after{opacity:1;transform:none;pointer-events:auto}
.stage{transition:padding .5s ease}.done .stage{padding-bottom:6px}
.btn{display:inline-block;margin-top:10px;padding:11px 32px;border-radius:999px;background:linear-gradient(180deg,#C9727A,#A9484E);color:#fff;text-decoration:none;letter-spacing:.14em;font-size:15px}
.pt{position:fixed;top:-30px;z-index:0;pointer-events:none;width:var(--w);height:calc(var(--w)*1.35);background:radial-gradient(ellipse at 40% 30%,#FBD3DD,#F2A3B6);border-radius:80% 10% 80% 10%;opacity:.7;animation:fall var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){.pt{display:none}.knob.pulse svg{animation:none}}
.ends{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px}
.ends button{font-family:inherit;border:0;cursor:pointer;padding:12px 34px;border-radius:999px;font-size:16px;letter-spacing:.14em;min-width:200px}
.ends .go{background:linear-gradient(180deg,#C9727A,#A9484E);color:#fff;box-shadow:0 6px 16px rgba(169,72,78,.3)}
.ends .rs{background:#fff;color:#A9484E;box-shadow:inset 0 0 0 1.5px #E2B6B9}
.ends .go{animation:hlPop 3s ease-out 1s infinite,hlGlow 3s ease-in-out 1s infinite}
@keyframes hlPop{0%,30%,100%{transform:scale(1)}8%{transform:scale(1.08) translateY(-1px)}16%{transform:scale(.98)}23%{transform:scale(1.02)}}
@keyframes hlGlow{0%,100%{box-shadow:0 6px 16px rgba(169,72,78,.3)}50%{box-shadow:0 0 0 5px rgba(212,168,92,.5),0 4px 18px rgba(192,138,74,.55)}}
.ends .nx{background:transparent;color:#A9484E;padding:6px 20px;font-size:14px;min-width:0;text-decoration:underline;text-underline-offset:4px;opacity:.85}
.sw{font-size:12px;color:#8C6A5E;letter-spacing:.1em;margin-top:8px}
.idle{position:relative;z-index:2;font-size:13px;color:#8C6A5E;letter-spacing:.12em;opacity:0;transition:opacity .6s;height:18px;text-align:center}
.idle.on{opacity:1}.done .idle{opacity:0!important}
</style></head><body>
<div class="top"><div class="small">— THE WEDDING OF —</div><div class="names">Chun-Hao &amp; Liang-Jou</div></div>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="ph on" style="--i:1"><div class="bg" style="background-image:url(p1.jpg)"></div><div class="fg" style="background-image:url(p1.jpg)"></div></div>
    <div class="ph"><div class="bg" style="background-image:url(p2.jpg)"></div><div class="fg" style="background-image:url(p2.jpg)"></div></div>
    <div class="ph"><div class="bg" style="background-image:url(p3.jpg)"></div><div class="fg" style="background-image:url(p3.jpg)"></div></div>
    <div class="ph"><div class="bg" style="background-image:url(p4.jpg)"></div><div class="fg" style="background-image:url(p4.jpg)"></div></div>
  </div>
  <div class="say" id="say"></div>
  <svg class="rope" id="rope"><path id="rp" d=""/></svg>
  <div class="knob pulse" id="knob"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#D3252B"/></svg></div>
</div>
<div class="cap" id="cap"></div>
<div class="hint" id="hint"></div>
<div class="dots" id="dots"><i class="on"></i><i></i><i style="display:none"></i><i></i></div>
<div class="after">
  <div class="ends"><button class="go" data-go="top">看喜帖 ↓</button><button class="nx" data-go="next">看其他開場 ↻</button></div>
</div>
<div class="idle" id="idle">用手指按住愛心，往下拉 ↓</div>
<script>
(function(){for(var i=0;i<12;i++){var e=document.createElement('i');e.className='pt';e.style.cssText='left:'+Math.random()*100+'vw;--w:'+(10+Math.random()*10)+'px;--d:'+(9+Math.random()*8)+'s;--dl:-'+(Math.random()*14)+'s;--x:'+(Math.random()*120-60)+'px';document.body.appendChild(e);}})();
(function(){
  // 每一頁：往哪邊拉（-1 左 / +1 右）、紅線從照片哪個高度出來、上方字
  var P=[
    {dir:-1,at:[.286,.56],drop:.30,ar:1100/733,say:['抓到你了！',.07,.05,'l'],cap:'',hint:'把愛心往下拉，幫新娘把新郎拉過來 ♡'},
    {dir: 1,at:[.792,.985],drop:.10,ar:1100/733,say:['換我抓你！',.86,.03,'r'],cap:'',hint:'再往下拉一次，換新郎反擊！'},
    {dir:-1,at:[.137,.80],drop:.09,ar:733/1100,say:['誰也跑不掉！',.05,.15,'l'],cap:'',hint:'把兩個人綁在一起 ♡'},
    {dir: 0,cap:'<span class="en">We\'re getting married ♡</span>',hint:''}
  ];
  var st=document.getElementById('stage'), fr=document.getElementById('frame'), rp=document.getElementById('rp'),
      knob=document.getElementById('knob'), cap=document.getElementById('cap'), hint=document.getElementById('hint'),
      phs=fr.querySelectorAll('.ph'), dots=document.querySelectorAll('#dots i');
  var i=0, drag=false, sx=0, sy=0, pull=0, back=0, raf=null;
  function geo(){ var s=st.getBoundingClientRect(), f=fr.getBoundingClientRect(); return {s:s,f:f}; }
  function draw(){
    var g=geo(), d=P[i].dir, w=g.s.width, h=g.s.height;
    if(!d){ rp.setAttribute('d',''); knob.style.display='none'; if(!back) fr.style.transform=''; return; }
    knob.style.display='';
    // 照片在框內是 contain：算出照片實際顯示範圍，再把紅線起點對到照片裡的紅線
    var fw=fr.offsetWidth, fh=fr.offsetHeight, ar=P[i].ar, pw,ph,ox,oy;
    if(ar>fw/fh){ pw=fw; ph=fw/ar; ox=0; oy=(fh-ph)/2; } else { ph=fh; pw=fh*ar; oy=0; ox=(fw-pw)/2; }
    var fl=g.f.left-g.s.left, ft=g.f.top-g.s.top;
    var ax=fl+ox+pw*P[i].at[0], ay=ft+oy+ph*P[i].at[1];
    // 往下拉的設計：紅線從照片裡垂下來，愛心掛在照片下方
    var fb=ft+fh, t=Math.min(1,pull/120);
    var kx=Math.max(fl+34,Math.min(fl+fw-34,ax+d*26)), ky=fb+52+pull*0.8;
    var sag=(ky-ay)*(0.45-0.25*t);
    var c1x=ax+d*18*(1-t), c1y=ay+sag, c2x=kx, c2y=ky-sag;
    rp.setAttribute('d','M'+ax+' '+(ay-2)+' C'+c1x+' '+c1y+' '+c2x+' '+c2y+' '+kx+' '+ky);
    knob.style.left=kx+'px'; knob.style.top=ky+'px';
    fr.style.transform='translate('+(d*pull*0.04)+'px,'+(pull*0.03)+'px)';
  }
  function placeSay(){
    var b=document.getElementById('say'), q=P[i].say; if(!q){ b.classList.remove('on'); return; }
    var fw=fr.offsetWidth, fh=fr.offsetHeight, ar=P[i].ar, pw,ph,ox,oy;
    if(ar>fw/fh){ pw=fw; ph=fw/ar; ox=0; oy=(fh-ph)/2; } else { ph=fh; pw=fh*ar; oy=0; ox=(fw-pw)/2; }
    var fl=fr.offsetLeft, ft=fr.offsetTop, x=fl+ox+pw*q[1], y=ft+oy+ph*q[2];
    b.textContent=q[0]; b.className='say '+q[3];
    var bw=b.offsetWidth, bh=b.offsetHeight;
    b.style.left=(q[3]==='l'? x : x-bw)+'px'; b.style.top=Math.max(ft+8,y-bh)+'px';
    b.style.setProperty('--to',q[3]==='l'?'20% 100%':'80% 100%');
    b.offsetWidth; b.classList.add('on');
  }
  function show(n,dirFrom){
    i=n; phs.forEach(function(p,k){ p.classList.toggle('on',k===i); });
    dots.forEach(function(d,k){ d.classList.toggle('on',k===i); });
    cap.innerHTML=P[i].cap?'<span>'+P[i].cap+'</span>':'';
    placeSay();
    hint.textContent=P[i].hint;
    document.body.classList.toggle('done',i===3);
    if(i===3) burst();
    pull=0; back=0; fr.style.transition='transform .45s cubic-bezier(.3,1.5,.5,1)'; draw();
    setTimeout(function(){ fr.style.transition=''; },460);
  }
  function burst(){
    var f=fr.getBoundingClientRect(), cx=f.left+f.width/2, cy=f.top+f.height*.25;
    for(var k=0;k<16;k++){ var e=document.createElement('div'); e.className='burst';
      e.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="'+(k%3?'#D3252B':'#F2A3B6')+'"/></svg>';
      e.style.left=cx+'px'; e.style.top=cy+'px'; document.body.appendChild(e);
      var a=Math.random()*Math.PI*2, r=90+Math.random()*120, s=.6+Math.random()*.9;
      e.animate([{transform:'translate(0,0) scale(.2)',opacity:1},{transform:'translate('+Math.cos(a)*r+'px,'+(Math.sin(a)*r-40)+'px) scale('+s+') rotate('+(Math.random()*120-60)+'deg)',opacity:0}],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=(function(el){return function(){el.remove();};})(e);
    }
  }
  var lastDx=0; st.addEventListener('pointerdown',function(e){ drag=true; sx=e.clientX; sy=e.clientY; lastDx=0; knob.classList.remove('pulse'); try{st.setPointerCapture(e.pointerId);}catch(_){} });
  st.addEventListener('pointermove',function(e){ if(!drag) return; var dx=e.clientX-sx, dy=e.clientY-sy; lastDx=Math.max(Math.abs(dx),Math.abs(dy)); var _u=0, d=P[i].dir, prevDir=i>0?P[i-1].dir:0;
    // 長輩友善：往哪邊拉都算，不再有「往回拉倒回去」
    pull = d ? Math.max(dy,Math.abs(dx)*0.6,0) : 0; back=0;  // 主要往下拉；往旁邊拉也算一點
    cancelAnimationFrame(raf); raf=requestAnimationFrame(draw); });
  function up(){ if(!drag) return; drag=false; knob.classList.add('pulse');
    var th=Math.min(60,st.clientWidth*.12);
    if(pull>th && i<3){ window.MOVED=true; show(nx()); }
    else { pull=0; back=0; fr.style.transition='transform .4s cubic-bezier(.3,1.5,.5,1)'; draw(); setTimeout(function(){ fr.style.transition=''; },420); }
  }
  function autoPull(){ var t0=performance.now(); (function a(t){ var k=Math.min(1,(t-t0)/420); pull=k*k*130; draw(); if(k<1) requestAnimationFrame(a); else show(nx()); })(t0); }
  // 只拉兩次：第二下拉完直接進結尾（不播「綁在一起」那段）
  function nx(){ return i===1 ? 3 : i+1; }
  st.addEventListener('pointerup',up); st.addEventListener('pointercancel',up);
  addEventListener('resize',function(){ draw(); placeSay(); });
  window.HANDDIR=function(){ return P[i].dir; };
  show(0);
  // 一開始輕輕拉一下示範
  setTimeout(function(){ if(i===0&&!drag){ var t0=performance.now(); (function a(t){ var k=(t-t0)/900; if(k>1||drag){ pull=0; draw(); return; } pull=Math.sin(k*Math.PI)*40; draw(); requestAnimationFrame(a); })(t0); } },1000);
})();
</script>
<script>
(function(){
  function goTo(t){ try{ if(window.parent!==window){ window.parent.postMessage({intro:t},'*'); return; } }catch(_){} location.href='../../index.html'+(t==='rsvp'?'#rsvp':''); }
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click',function(e){ e.stopPropagation(); goTo(b.getAttribute('data-go')); }); });
  // 2 秒後出現提示（剛示範完）；還沒成功操作過才顯示提示
  var idle=document.getElementById('idle');
  setTimeout(function(){ window.TAP_OK=true; if(!window.MOVED && idle) idle.classList.add('on'); },2000);
  addEventListener('pointerdown',function(){ idle&&idle.classList.remove('on'); },true);
})();
</script>
<script>window.HAND={isDone:function(){return window.HANDDIR&&window.HANDDIR()===0;},vpath:function(){var k=document.getElementById('knob').getBoundingClientRect();return [k.left+k.width/2,k.top+k.height/2,k.top+k.height/2+90];},target:'#stage',y:.5,dir:function(){return window.HANDDIR?window.HANDDIR():1;},rev:function(){return 1;}};</script><script src="../hand.js?v=6"></script>
</body></html>
